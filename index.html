<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F1710A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <title>Pollos Vivi · POS</title>
    <script>
      // Evita el "flash" de tema incorrecto: aplica la clase `dark` antes del primer paint,
      // leyendo la preferencia persistida (zustand/persist) o, en su defecto, el SO.
      (function () {
        try {
          var raw = localStorage.getItem('pos-pollos-vivi/theme');
          var mode = raw ? JSON.parse(raw).state.mode : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
